# Local run: `docker compose -f compose.local.yml up --build` serves http://127.0.0.1:4731/.
# Production / open-internet deployments use `compose.yml` behind Dokploy / Traefik with HTTPS.
services:
  backend:
    build:
      context: .
      target: backend
    init: true
    restart: unless-stopped
    ports:
      - "${RUPICOLA_BIND_IP:-127.0.0.1}:${RUPICOLA_BACKEND_PORT:-4730}:4730"
    environment:
      HOST: "0.0.0.0"
      PORT: "4730"
      RUPICOLA_DB: "/data/backend.db"
      RUPICOLA_SETUP_CODE: "${RUPICOLA_SETUP_CODE:-}"
    volumes:
      - rupicola-backend-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "./rupicola-backend", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      target: panel
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${RUPICOLA_BIND_IP:-127.0.0.1}:${RUPICOLA_PORT:-4731}:4731"
    environment:
      HOST: "0.0.0.0"
      PORT: "4731"
      XDG_DATA_HOME: "/data"
      RUPICOLA_DB: "/data/panel.db"
      RUPICOLA_CAPTURES: "/data/captures"
      RUPICOLA_SERVER_URL: "http://backend:4730"
    volumes:
      - rupicola-local-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "./rupicola-panel", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rupicola-local-data:
  rupicola-backend-data:
