id = "hard-iced-text-contrast"
framework = "iced"
kind = "review"
split = "dev"
should_trigger = true
prompt = "Review src/main.rs of this Iced app for accessibility problems. Report findings only; do not edit code."
constraints = ["Do not modify any file"]
[[seeded_defect]]
id = "hint-contrast-4-48"
keywords = ["#777", "777777", "0x77", "4.48", "4.47"]
file = "src/main.rs"
description = "The 14 px hint text is #777777 on white, a contrast ratio of about 4.48:1, just below the 4.5:1 minimum."
[[verifier]]
name = "no-source-changes"
command = '''test -z "$(git status --porcelain -- . ':!.claude')"'''
