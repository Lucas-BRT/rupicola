id = "hard-gtk4-keyboard-gesture"
framework = "gtk4"
kind = "review"
split = "dev"
should_trigger = true
prompt = "Review src/main.rs of this GTK4 app for accessibility problems. Report findings only; do not edit code."
constraints = ["Do not modify any file"]
[[seeded_defect]]
id = "delete-not-keyboard-operable"
keywords = ["keyboard", "focusable", "gesture", "button"]
file = "src/main.rs"
description = "The delete action is a GestureClick on a plain Box: it cannot take focus, cannot be activated by keyboard and has no accessible role or name."
[[verifier]]
name = "no-source-changes"
command = '''test -z "$(git status --porcelain -- . ':!.claude')"'''
