id = "ux-iced-plural"
framework = "iced"
kind = "review"
split = "dev"
should_trigger = true
prompt = "Review src/main.rs of this Iced app for localization problems. Report findings only; do not edit code."
constraints = ["Do not modify any file"]
[[seeded_defect]]
id = "hardcoded-english-plural"
keywords = ["plural", "cldr", "concatenat", "translat", "localiz", "i18n", "fluent", "gettext"]
file = "src/main.rs"
description = "The plural is chosen with n == 1 and the sentence is assembled from fragments, so other languages with more plural categories and different word order cannot be translated."
[[verifier]]
name = "no-source-changes"
command = '''test -z "$(git status --porcelain -- . ':!.claude')"'''
