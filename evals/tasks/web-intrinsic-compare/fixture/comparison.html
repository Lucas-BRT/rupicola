<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capture comparison</title>
<style>
  body { margin: 1rem; font: 1rem system-ui; }
  .pane { inline-size: min(100%, 380px); border: 1px solid; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 1rem; }
  figure { margin: 0; }
  img { display: block; inline-size: 100%; background: #c3d8dc; }
  @media (width < 600px) { .pair { grid-template-columns: 1fr; } }
</style>
<main class="pane">
  <h1>Comparison</h1>
  <div class="pair">
    <figure>
      <img alt="Before: square in upper left" width="420" height="680" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 680'%3E%3Crect x='30' y='30' width='80' height='80' fill='%231a5764'/%3E%3C/svg%3E">
      <figcaption>Previous run</figcaption>
    </figure>
    <figure>
      <img alt="After: square centered" width="640" height="400" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 400'%3E%3Crect x='280' y='160' width='80' height='80' fill='%231a5764'/%3E%3C/svg%3E">
      <figcaption>Current run</figcaption>
    </figure>
  </div>
</main>
