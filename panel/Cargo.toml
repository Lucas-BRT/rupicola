[package]
name = "ferris-atelier-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
ferris-atelier = { path = ".." }
http = "=1.5.0"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
topcoat = { version = "=0.11.0", default-features = false, features = ["view", "serve", "tailwind", "ui"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
turso = { version = "=0.8.3", default-features = false }
argon2 = { version = "=0.5.3", features = ["std"] }
rand = "=0.8.6"
sha2 = "=0.10.9"
subtle = "=2.6.1"
url = "=2.5.8"
base64 = "=0.22.1"
tempfile = "=3.27.0"

[build-dependencies]
topcoat = { version = "=0.11.0", default-features = false, features = ["tailwind"] }
