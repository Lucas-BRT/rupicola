[workspace]
members = [
    "crates/rupicola-core",
    "crates/rupicola-api",
    "crates/rupicola-client",
    "apps/backend",
    "apps/cli",
    "apps/panel",
    "apps/site",
    "tools/eval-runner",
]
default-members = ["crates/rupicola-core", "crates/rupicola-api", "crates/rupicola-client", "apps/backend", "apps/cli", "tools/eval-runner"]
exclude = ["evals", "examples"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
authors = ["LucasBRT"]
repository = "https://github.com/Lucas-BRT/rupicola"

# Every version is pinned here once; members inherit with `workspace = true` and add their own features.
[workspace.dependencies]
rupicola-core = { path = "crates/rupicola-core" }
rupicola-api = { path = "crates/rupicola-api" }
rupicola-client = { path = "crates/rupicola-client" }
rupicola-protocol = { git = "https://github.com/Lucas-BRT/rupicola-protocol.git", branch = "feat/capture-session" }
rupicola-capture = { git = "https://github.com/Lucas-BRT/rupicola-protocol.git", branch = "feat/capture-session" }
anyhow = "=1.0.104"
async-trait = "=0.1.92"
argon2 = { version = "=0.5.3", features = ["std"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
clap = { version = "=4.6.9", features = ["derive"] }
getrandom = "=0.3.4"
governor = { version = "=0.10.4", default-features = false }
http = "=1.5.0"
mockall = "=0.15.0"
png = "=0.18.1"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
pulldown-cmark = "=0.13.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.1", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "=2.6.1"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = "=1.54.1"
toml = "=0.9.12"
topcoat = { version = "=0.11.0", default-features = false }
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["fs"] }
tower_governor = { version = "=0.8.0", default-features = false, features = ["axum"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
turso = { version = "=0.8.3", default-features = false }
url = "=2.5.8"
uuid = { version = "=1.29.3", features = ["v7"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_broken_link = "deny"
ignore_without_reason = "deny"
invalid_upcast_comparisons = "deny"
maybe_infinite_iter = "deny"
should_panic_without_expect = "deny"
unsafe_derive_deserialize = "deny"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.website]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 16
strip = true
