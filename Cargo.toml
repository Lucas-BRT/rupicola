[workspace]
members = [".", "panel", "site", "xtask"]
default-members = [".", "xtask"]
exclude = ["evals", "examples"]
resolver = "2"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.website]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[package]
name = "rupicola"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "rupicola"
description = "Rust-native tools for AI-assisted web and desktop interface development"
repository = "https://github.com/Lucas-BRT/rupicola"
readme = "README.md"
keywords = ["rust", "ui", "agent-skills", "desktop", "ai"]
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.9.12"
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
pulldown-cmark = "=0.13.6"
png = "=0.18.1"

[dev-dependencies]
tempfile = "=3.27.0"
