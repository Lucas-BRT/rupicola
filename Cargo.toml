[workspace]
members = [
    "crates/rupicola-core",
    "apps/cli",
    "apps/panel",
    "apps/site",
    "xtask",
]
default-members = ["crates/rupicola-core", "apps/cli", "xtask"]
exclude = ["evals", "examples"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_broken_link = "deny"
ignore_without_reason = "deny"
invalid_upcast_comparisons = "deny"
maybe_infinite_iter = "deny"
should_panic_without_expect = "deny"
unsafe_derive_deserialize = "deny"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.website]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 16
strip = true
