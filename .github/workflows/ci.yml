name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Format, lint and skill validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable run --locked -- check .
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          actual="$(cargo +stable run --quiet --locked -- --version)"
          test "$actual" = "rupicola ${GITHUB_REF_NAME#v}"

  tests:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust: stable
          - os: windows-2022
            rust: stable
          - os: macos-15
            rust: stable
          - os: ubuntu-24.04
            rust: '1.85.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: cargo +${{ matrix.rust }} test --locked

  binaries:
    name: Package (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: rupicola
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: rupicola.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: rupicola
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: rupicola
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Package CLI and skill
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist/rupicola
          cp "target/$TARGET/release/$BINARY" dist/rupicola/
          cp README.md SKILL.md dist/rupicola/
          cp -R agents reference dist/rupicola/
          "dist/rupicola/$BINARY" check dist/rupicola
          tar -czf "rupicola-$GITHUB_REF_NAME-$TARGET.tar.gz" -C dist rupicola
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rupicola-${{ matrix.target }}
          path: rupicola-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rupicola-*
          merge-multiple: true
          path: artifacts
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd artifacts
          sha256sum rupicola-*.tar.gz > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Rupicola $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" rupicola-*.tar.gz SHA256SUMS --clobber
