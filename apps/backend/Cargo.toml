[package]
name = "rupicola-backend"
description = "Rupicola API server: the only process that touches the database and media store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
governor.workspace = true
rupicola-api.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { workspace = true, features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { workspace = true, features = [
    "catch-panic",
    "fs",
    "limit",
    "request-id",
    "sensitive-headers",
    "set-header",
    "trace",
    "util",
] }
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde.workspace = true

[lints]
workspace = true
