<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src data:; base-uri 'none'; form-action 'none'">
<title>@@SYSTEM_NAME@@ · Design examples</title>
<style>
:root{--canvas:@@CANVAS@@;--surface:@@SURFACE@@;--ink:@@INK@@;--accent:@@ACCENT@@;--action-ink:@@ACTION_INK@@;--space:@@SPACE@@px;--radius:@@RADIUS@@px;--success:@@SUCCESS@@;--error:@@ERROR@@;--border:color-mix(in srgb,var(--ink) 27%,var(--surface))}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:1rem/1.5 system-ui,sans-serif;accent-color:var(--accent)}
main{width:min(calc(100% - 2rem),76rem);margin:auto;padding-block:clamp(1.25rem,4vw,3.25rem)}
h1,h2{font-family:@@HEADING@@;font-weight:400;line-height:1.09;letter-spacing:-.035em;margin:0}
h1{font-size:clamp(2rem,5vw,4rem);overflow-wrap:anywhere}
h2{font-size:1.65rem}
p{margin:.5rem 0 1.1rem;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--space);align-items:start}
section,form{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:2.75rem;border:1px solid var(--border);padding:.4rem .7rem;border-radius:calc(var(--radius) * .66);background:var(--surface);font-weight:650;cursor:pointer}
button:hover:not(:disabled),button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
button:disabled{opacity:.56;cursor:default}
.primary{background:var(--accent);color:var(--action-ink);border-color:var(--action-ink)}
figure{margin:0}
figcaption{font-weight:650}
#stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.625rem;background:var(--ink);color:var(--surface);padding:.625rem;border-radius:calc(var(--radius) * .66)}
#stage.split{display:block;position:relative}
#stage img,#stage video{display:block;width:100%;aspect-ratio:8/5;object-fit:contain;background:var(--ink);border-radius:.2rem}
#stage img.overlay{position:absolute;inset:2.125rem .625rem .625rem;width:calc(100% - 1.25rem);height:calc(100% - 2.75rem);clip-path:inset(0 calc(100% - var(--split,50%)) 0 0)}
label{display:block;margin-top:.5rem;font-weight:650}
select,textarea{display:block;width:100%;padding:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) * .66)}
textarea{min-height:5.25rem;resize:vertical}
input[type=range]{width:100%;min-height:1.65rem}
form .bar{margin-top:.8rem}
#result,#media-error{border-inline-start:3px solid currentColor;padding-inline-start:.65rem}
#result{color:var(--success)}
#media-error{color:var(--error)}
.table{margin-top:var(--space);padding:var(--space)}
.scroll{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:25rem;text-align:left}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--border)}
tbody th{font-weight:600}
@media(max-width:58rem){.grid{grid-template-columns:1fr}}
@media(max-width:32rem){main{width:calc(100% - 1rem)}#stage:not(.split){grid-template-columns:1fr}button{font-size:.9rem}}
@@EXAMPLES_CSS@@
</style>
<header class="preview-nav"><div class="nav-inner">
  <span id="preview-brand" class="preview-brand">@@BRAND@@</span>
  <nav aria-label="Preview pages">
    <a href="#components">Components</a>
    <a href="#home">Home</a>
    <a href="#queue">Work queue</a>
    <a href="#settings">Settings</a>
    <a href="#evidence">Evidence review</a>
  </nav>
</div></header>
<main>
@@EXAMPLES_HTML@@
<div id="evidence" data-example hidden>
  <h1 tabindex="-1">@@TITLE@@</h1>
  <p>@@SCENARIO@@</p>
  <div class="grid">
    <section aria-label="Evidence viewer">
      <div class="bar" role="group" aria-label="Comparison mode">
        <button type="button" id="side" aria-pressed="true">Side by side</button>
        <button type="button" id="overlay" aria-pressed="false">Overlay</button>
        <button type="button" id="clips" aria-pressed="false">Clips</button>
        <button type="button" id="missing" aria-pressed="false">Unavailable media</button>
      </div>
      <div id="stage">
        <figure id="before"><figcaption>@@BEFORE_LABEL@@</figcaption><img src="@@BEFORE_PNG@@" alt="Settings with a longer notification label" width="480" height="300"></figure>
        <figure id="after"><figcaption>@@AFTER_LABEL@@</figcaption><img src="@@AFTER_PNG@@" alt="Settings with a shorter notification label and more spacing" width="480" height="300"></figure>
        <figure id="before-clip" hidden><figcaption>@@BEFORE_LABEL@@</figcaption><video controls muted playsinline preload="metadata" aria-label="Before clip" src="@@BEFORE_WEBM@@"></video></figure>
        <figure id="after-clip" hidden><figcaption>@@AFTER_LABEL@@</figcaption><video controls muted playsinline preload="metadata" aria-label="After clip" src="@@AFTER_WEBM@@"></video></figure>
      </div>
      <div id="divider" hidden><label for="split">Overlay position</label><input id="split" type="range" min="0" max="100" value="50"></div>
      <div id="media-error" hidden><p role="alert">This evidence is unavailable.</p><button type="button" id="retry">Reload example</button></div>
    </section>
    <form id="review">
      <h2>Record a review</h2>
      <label for="decision">Decision</label>
      <select id="decision" required><option value="">Choose a decision</option><option value="approve">Approve</option><option value="changes">Request changes</option></select>
      <label for="note">Note</label>
      <textarea id="note" maxlength="500"></textarea>
      <div class="bar"><button id="record" class="primary" type="submit">Record review</button><button id="clear" type="reset">Clear</button></div>
      <p id="result" role="status" hidden></p>
    </form>
  </div>
  <section class="table">
    <h2 id="evidence-title">Evidence in this review</h2>
    <div class="scroll" role="region" tabindex="0" aria-labelledby="evidence-title">
      <table>
        <thead><tr><th scope="col">Capture</th><th scope="col">Format</th><th scope="col">Review</th></tr></thead>
        <tbody><tr><th scope="row">Notification layout</th><td>Image</td><td id="example-status">Pending</td></tr><tr><th scope="row">Toggle response</th><td>Clip</td><td>Pending</td></tr></tbody>
      </table>
    </div>
  </section>
</div>
</main>
<script>
const el = id => document.getElementById(id);
const modes = ["side", "overlay", "clips", "missing"];
const sources = [...document.querySelectorAll("#stage img, #stage video")].map(media => [media, media.src]);
function selectMode(mode) {
  modes.forEach(id => el(id).setAttribute("aria-pressed", String(id === mode)));
  el("stage").hidden = mode === "missing";
  el("stage").classList.toggle("split", mode === "overlay");
  el("before").hidden = el("after").hidden = mode === "clips";
  const image = el("after").querySelector("img");
  image.classList.toggle("overlay", mode === "overlay");
  el("after").querySelector("figcaption").hidden = mode === "overlay";
  el("divider").hidden = mode !== "overlay";
  el("media-error").hidden = mode !== "missing";
  for (const id of ["before-clip", "after-clip"]) {
    el(id).hidden = mode !== "clips";
    if (mode !== "clips") el(id).querySelector("video").pause();
  }
}
modes.forEach(id => el(id).addEventListener("click", () => selectMode(id)));
for (const [media] of sources) media.addEventListener("error", () => selectMode("missing"));
el("retry").addEventListener("click", () => {
  for (const [media, source] of sources) {
    if (media.src !== source || media.error) media.src = source;
  }
  selectMode("side");
  el("side").focus();
});
el("split").addEventListener("input", event => {
  el("stage").style.setProperty("--split", event.target.value + "%");
});
el("review").addEventListener("submit", event => {
  event.preventDefault();
  const value = el("decision").value;
  if (!value) return;
  el("example-status").textContent = value === "approve" ? "Approved" : "Changes requested";
  el("result").textContent = "Review recorded in this example.";
  el("result").hidden = false;
  el("record").disabled = true;
  el("clear").focus();
});
el("review").addEventListener("reset", () => {
  el("result").hidden = true;
  el("record").disabled = false;
  el("example-status").textContent = "Pending";
});
@@EXAMPLES_JS@@
</script>
</html>
