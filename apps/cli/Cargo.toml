[package]
name = "rupicola"
description = "Rust-native tools for AI-assisted web and desktop interface development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "rupicola"
readme = "../../README.md"
keywords = ["rust", "ui", "agent-skills", "desktop", "ai"]
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
rupicola-api.workspace = true
rupicola-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rupicola-client.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-std", "io-util"] }
rpassword.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
