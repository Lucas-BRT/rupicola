[package]
name = "rupicola"
description = "Rust-native tools for AI-assisted web and desktop interface development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "rupicola"
readme = "../../README.md"
keywords = ["rust", "ui", "agent-skills", "desktop", "ai"]
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
rupicola-api.workspace = true
rupicola-core = { workspace = true, features = ["clap"] }
rupicola-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
ureq.workspace = true
sha2.workspace = true

[lints]
workspace = true
