[package]
name = "rupicola"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
default-run = "rupicola"
description = "Rust-native tools for AI-assisted web and desktop interface development"
repository = "https://github.com/Lucas-BRT/rupicola"
readme = "../../README.md"
keywords = ["rust", "ui", "agent-skills", "desktop", "ai"]
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
rupicola-core = { path = "../../crates/rupicola-core" }
rupicola-protocol = { git = "https://github.com/Lucas-BRT/rupicola-protocol.git", tag = "v0.2.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.9.12"
tempfile = "=3.27.0"

[lints]
workspace = true
