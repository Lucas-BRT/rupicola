[package]
name = "rupicola-server"
description = "Rupicola API server: the only process that touches the database and media store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
governor.workspace = true
http-body-util.workspace = true
png.workspace = true
rupicola-api = { workspace = true, features = ["capture"] }
rupicola-capture.workspace = true
rupicola-core.workspace = true
rupicola-protocol.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true, features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { workspace = true, features = [
    "catch-panic",
    "fs",
    "limit",
    "request-id",
    "sensitive-headers",
    "set-header",
    "trace",
    "util",
] }
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
