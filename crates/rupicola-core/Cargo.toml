[package]
name = "rupicola-core"
description = "Shared domain, capture, scan, and record logic for Rupicola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
rupicola-protocol.workspace = true
rupicola-capture = { workspace = true, features = ["async"] }
clap = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
syn.workspace = true
proc-macro2.workspace = true
pulldown-cmark.workspace = true
png.workspace = true
tempfile.workspace = true

[features]
# Derives `clap::ValueEnum` on the record enums for command-line front ends.
clap = ["dep:clap"]

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
