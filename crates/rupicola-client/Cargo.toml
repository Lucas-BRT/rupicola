[package]
name = "rupicola-client"
description = "Client for the Rupicola backend API, with an in-memory fake for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# `MockApi`, generated by mockall, for tests of code that takes an `Api`.
mock = ["dep:mockall"]

[dependencies]
async-trait.workspace = true
mockall = { workspace = true, optional = true }
reqwest.workspace = true
rupicola-api.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Turns the `mock` feature on for this crate's own tests.
rupicola-client = { path = ".", features = ["mock"] }
axum.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
