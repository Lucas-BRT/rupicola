[package]
name = "rupicola-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Lightweight landing page and documentation server for Rupicola"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
http = "=1.5.0"
pulldown-cmark = "=0.13.6"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }
topcoat = { version = "=0.11.0", default-features = false, features = ["serve"] }

[lints]
workspace = true
